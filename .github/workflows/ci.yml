# CI — the verification gate. Runs on every PR to main and every push to a
# feature branch or main. Delegates all checks to the reusable _verify.yml.
#
# This workflow NEVER deploys. Deployment is handled separately:
#   • deploy-staging.yml    — auto, after this workflow succeeds on `main`
#                             (main == the staging Supabase project njlbcrcoogpblscvjfah)
#   • deploy-production.yml  — on a published GitHub Release (v* tag) or manual
#                             dispatch, behind the `production` environment gate,
#                             re-running _verify.yml against the exact tagged commit
#   • deploy-web.yml         — Flutter web → Firebase Hosting (staging site) after CI,
#                             plus 7-day PR preview channels
#
# The workflow name "CI" is load-bearing: deploy-staging.yml and deploy-web.yml
# both key their `workflow_run` trigger off it. Do not rename without updating them.

name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# One CI run per branch/PR at a time; cancel the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml
  # --- injected by DevStudio --sync-ci ---
  # Marker: dev_studio:smart-installer
  devstudio_telemetry:
    name: DevStudio CLI telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install DevStudio CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/maromsa/dev-studio/master/install.sh | bash
          echo "$HOME/.cache/dev_studio/bin" >> "$GITHUB_PATH"
      - name: DevStudio status (SaaS telemetry)
        env:
          DEV_STUDIO_TOKEN: ${{ secrets.DEV_STUDIO_TOKEN }}
          DEV_STUDIO_API_URL: ${{ secrets.DEV_STUDIO_API_URL }}
        run: dev_studio --status --json
