name: parking_trade
description: A building-gated parking swap app for high-rise residents
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.0.0
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  
  # Local Notifications
  flutter_local_notifications: ^20.0.0
  
  # Push Notifications (FCM)
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1

  # Error tracking / observability
  sentry_flutter: ^9.6.0
  
  # Utils
  uuid: ^4.2.1
  http: ^1.1.0

  # Localization
  easy_localization: ^3.0.7

  # Typography — premium Google Fonts (used globally for a modern UI)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  shared_preferences: ^2.3.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/translations/

